packages:
  - apps/*
  - packages/*
  - fixtures/*

# Dependencies allowed to run install scripts; everything else is denied (supply-chain hygiene).
# esbuild installs its platform binary. Electron needs no script: it downloads its binary on first use.
allowBuilds:
  esbuild: true
  electron-winstaller: false

minimumReleaseAgeExclude:
  - '@zone-eu/mailsplit@5.4.19'
  - imapflow@2.1.2
  - libbase64@1.3.1
  - libmime@5.4.6
  - libqp@2.1.2

# Transitive security fix: imapflow -> socks -> ip-address <=10.7.3 parses an IPv6 zone id in quadratic time.
overrides:
  ip-address: 10.7.4
  # Build and test tooling (not shipped in the app): electron-builder and @electron/get pin undici and
  # fast-uri ranges with TLS-validation and parsing advisories; vite/postcss pull source-map-js.
  undici@6: 6.29.1
  undici@7: 7.30.1
  fast-uri@3: 3.1.9
  source-map-js: 1.2.2
  vitest>vite: 8.3.5
  '@vitest/mocker>vite': 8.3.5
