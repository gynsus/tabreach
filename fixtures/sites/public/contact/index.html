<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Contact</title>
  </head>
  <body>
    <!-- A contact form for critical-action tests (Phase 5c). Every press of Send is counted in
         localStorage, so tests can prove an action was never repeated. ?result= picks what the
         site does: thanks (default), reject (a validation error on the same form) or silent. -->
    <main id="page">
      <h1>Contact us</h1>
      <form id="contact">
        <label>Your name <input name="name" /></label>
        <label>Message <textarea name="message"></textarea></label>
        <button type="submit">Send</button>
      </form>
    </main>
    <script>
      const result = new URLSearchParams(location.search).get('result') ?? 'thanks';
      document.getElementById('contact').addEventListener('submit', (e) => {
        e.preventDefault();
        const sent = JSON.parse(localStorage.getItem('fixture_submissions') ?? '[]');
        sent.push(Object.fromEntries(new FormData(e.target)));
        localStorage.setItem('fixture_submissions', JSON.stringify(sent));
        if (result === 'reject') {
          const error = document.createElement('p');
          error.setAttribute('role', 'alert');
          error.textContent = 'Please enter a longer message.';
          e.target.append(error);
        } else if (result === 'thanks') {
          document.getElementById('page').innerHTML = '<h1>Thank you</h1><p>Your message was sent.</p>';
        }
      });
    </script>
  </body>
</html>
