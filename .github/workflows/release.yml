name: Release

# Signed, notarized DMGs for arm64 and x64 (docs/22 Phase 8e). Runs on a version tag or by hand;
# the build refuses to finish unsigned (TABREACH_RELEASE=1). The secrets are created by the owner
# (docs/DEVELOPMENT.md "Signing and notarization") and never stored in the repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          TABREACH_RELEASE: '1'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm dist

      - name: Notarize and staple the DMGs
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in apps/desktop/release/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify signature, notarization and the packaged app
        run: |
          cd apps/desktop/release
          for app in mac-arm64/TabReach.app mac/TabReach.app; do
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate "$app"
          done
          for dmg in *.dmg; do xcrun stapler validate "$dmg"; done
          mac-arm64/TabReach.app/Contents/MacOS/TabReach --self-check

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "TabReach ${GITHUB_REF_NAME#v}" apps/desktop/release/*.dmg
